[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fmv"
description = "Fast matplotlib videos: a figure drawn once, only its changing artists redrawn per frame (blitting), the frames piped to ffmpeg"
readme = "README.md"
requires-python = ">=3.12"
version = "0.1.0"
dependencies = [
  "numpy",
  "matplotlib",
  "imageio-ffmpeg",
]

[tool.setuptools.packages.find]
include = ["fmv*"]

[dependency-groups]
dev = [
  "pytest",
  "ruff",
]
